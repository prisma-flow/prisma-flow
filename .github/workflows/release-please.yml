name: Prepare release

on:
  push:
    branches: [main]

concurrency:
  group: release-please-main
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Create, format, and validate the release PR
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20.x'
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Format and validate the generated release PR
        env:
          RELEASE_PRS: ${{ steps.release.outputs.prs }}
        shell: bash
        run: |
          BRANCH="$(echo "$RELEASE_PRS" | jq -r '.[0].headBranchName // empty')"
          if [ -z "$BRANCH" ]; then
            echo "No release PR was created or updated."
            exit 0
          fi

          git fetch origin "$BRANCH"
          git checkout --track "origin/$BRANCH"
          npm run format
          npm run format:check
          npm run lint

          if git diff --quiet; then
            echo "Release PR is already formatted."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "chore: format release files"
          git push origin "HEAD:$BRANCH"
