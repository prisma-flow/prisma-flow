name: Publish release

on:
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:
    inputs:
      mode:
        description: 'Publish mode: "bootstrap" (initial untagged 0.2.0 release) or "retry" (reconcile partial release state for existing tag)'
        required: true
        type: choice
        options:
          - bootstrap
          - retry
      version:
        description: 'Exact SemVer version to publish (e.g. 0.2.0)'
        required: true
        type: string

concurrency:
  group: npm-publish-main
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write # Required for npm provenance / trusted publishing
  pull-requests: write # Required to view and update Release Please pull request state
  issues: write # Required for label mutations on pull requests via GitHub Issues API

jobs:
  publish:
    name: Verify and publish prisma-flow
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.merged == true &&
       github.event.pull_request.user.login == 'github-actions[bot]' &&
       contains(github.event.pull_request.labels.*.name, 'autorelease: pending'))
    runs-on: ubuntu-latest
    steps:
      - name: Resolve immutable target commit
        id: target
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            TARGET_SHA="${{ github.event.pull_request.merge_commit_sha || github.sha }}"
            echo "Automated PR release target merge commit: $TARGET_SHA"
          else
            TARGET_SHA="${{ github.sha }}"
            echo "Manual workflow_dispatch release target commit: $TARGET_SHA"
          fi
          echo "target_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout target commit
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.target.outputs.target_sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.x"
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Ensure pinned npm 11.8.0 for trusted publishing
        run: npm install -g npm@11.8.0

      - name: Validate version invariants and state
        id: release-context
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          CLI_VERSION="$(node -p "require('./packages/cli/package.json').version")"
          MANIFEST_VERSION="$(node -p "const m = require('./.release-please-manifest.json'); m['.'] || m['packages/cli']")"
          TARGET_SHA="${{ steps.target.outputs.target_sha }}"

          echo "CLI package version: $CLI_VERSION"
          echo "Manifest version:    $MANIFEST_VERSION"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ github.event.inputs.mode }}"
            REQ_VERSION="${{ github.event.inputs.version }}"

            echo "Execution Mode: $MODE"
            echo "Requested Version: $REQ_VERSION"

            if [ "$MODE" = "bootstrap" ]; then
              if [ "$REQ_VERSION" != "$CLI_VERSION" ]; then
                echo "::error::Requested version ($REQ_VERSION) does not match packages/cli/package.json ($CLI_VERSION)"
                exit 1
              fi
              if [ "$REQ_VERSION" != "$MANIFEST_VERSION" ]; then
                echo "::error::Requested version ($REQ_VERSION) does not match .release-please-manifest.json ($MANIFEST_VERSION)"
                exit 1
              fi
              if git rev-parse "v$REQ_VERSION" >/dev/null 2>&1; then
                echo "::error::Tag v$REQ_VERSION already exists. Bootstrap is for initial untagged release only. Use 'retry' mode instead."
                exit 1
              fi
              if npm view "prisma-flow@$REQ_VERSION" version >/dev/null 2>&1; then
                echo "::error::prisma-flow@$REQ_VERSION already exists on npm. Bootstrap aborted."
                exit 1
              fi
              if gh release view "v$REQ_VERSION" >/dev/null 2>&1; then
                echo "::error::GitHub Release v$REQ_VERSION already exists. Bootstrap aborted."
                exit 1
              fi
              RELEASE_VERSION="$REQ_VERSION"
            elif [ "$MODE" = "retry" ]; then
              if ! git rev-parse "v$REQ_VERSION" >/dev/null 2>&1; then
                echo "::error::Tag v$REQ_VERSION does not exist. Retry mode requires an existing canonical tag. Use 'bootstrap' mode for initial untagged release."
                exit 1
              fi
              echo "Checking out existing canonical tag v$REQ_VERSION..."
              git checkout "v$REQ_VERSION"
              TAG_CLI_VERSION="$(node -p "require('./packages/cli/package.json').version")"
              if [ "$TAG_CLI_VERSION" != "$REQ_VERSION" ]; then
                echo "::error::Tag v$REQ_VERSION contains packages/cli version $TAG_CLI_VERSION instead of $REQ_VERSION"
                exit 1
              fi
              RELEASE_VERSION="$REQ_VERSION"
            fi
          else
            # Automated Release Please PR merge
            MODE="automated"
            if [ "$CLI_VERSION" != "$MANIFEST_VERSION" ]; then
              echo "::error::CLI version ($CLI_VERSION) does not match release manifest ($MANIFEST_VERSION)"
              exit 1
            fi
            RELEASE_VERSION="$CLI_VERSION"
          fi

          echo "release_version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Install workspace dependencies
        run: npm ci

      - name: Verify release readiness
        run: npm run verify:release
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Ensure canonical Git tag exists before publication
        id: git-tag
        shell: bash
        run: |
          VERSION="${{ steps.release-context.outputs.release_version }}"
          MODE="${{ steps.release-context.outputs.mode }}"
          TARGET_SHA="${{ steps.target.outputs.target_sha }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            TAG_COMMIT="$(git rev-list -n 1 "v$VERSION")"
            if [ "$MODE" = "automated" ]; then
              if [ "$TAG_COMMIT" != "$TARGET_SHA" ]; then
                echo "::error::Canonical tag v$VERSION exists but points to commit $TAG_COMMIT, which does not match immutable target release commit $TARGET_SHA. Automated publication aborted."
                exit 1
              fi
              echo "Canonical tag v$VERSION already exists and correctly points to target commit $TARGET_SHA."
            elif [ "$MODE" = "retry" ]; then
              echo "Canonical tag v$VERSION exists pointing to $TAG_COMMIT. Using existing tag as release authority for retry reconciliation."
            fi
          else
            echo "Creating and pushing canonical tag v$VERSION pointing at $TARGET_SHA..."
            git tag -a "v$VERSION" "$TARGET_SHA" -m "Release v$VERSION"
            git push origin "v$VERSION"
            echo "Successfully pushed canonical tag v$VERSION."
          fi

      - name: Publish npm package (Trusted Publishing / Provenance)
        id: npm-publish
        shell: bash
        run: |
          VERSION="${{ steps.release-context.outputs.release_version }}"

          if npm view "prisma-flow@$VERSION" version >/dev/null 2>&1; then
            echo "prisma-flow@$VERSION is already published on npm registry. Skipping npm publish."
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            echo "Publishing prisma-flow@$VERSION to npm with provenance..."
            npm publish --workspace=prisma-flow --provenance --access public
            echo "Successfully published prisma-flow@$VERSION."
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Reconcile GitHub Release
        id: gh-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          VERSION="${{ steps.release-context.outputs.release_version }}"
          TARGET_SHA="${{ steps.target.outputs.target_sha }}"

          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "GitHub Release v$VERSION already exists. Leaving unchanged."
          else
            echo "Creating GitHub Release for v$VERSION..."
            PREVIOUS_TAG="$(git describe --tags --abbrev=0 "v$VERSION"^ 2>/dev/null || true)"
            if [ -n "$PREVIOUS_TAG" ]; then
              git log "$PREVIOUS_TAG".."v$VERSION" --pretty=format:"- %s (%h)" > release-notes.txt
            else
              git log -n 25 --pretty=format:"- %s (%h)" "v$VERSION" > release-notes.txt
            fi

            gh release create "v$VERSION" \
              --title "v$VERSION" \
              --notes-file release-notes.txt

            echo "Successfully created GitHub Release v$VERSION."
          fi

      - name: Reconcile Release PR labels
        id: reconcile-pr-labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          VERSION="${{ steps.release-context.outputs.release_version }}"
          MODE="${{ steps.release-context.outputs.mode }}"
          PUBLISHED_IN_RUN="${{ steps.npm-publish.outputs.published }}"

          if [ "$MODE" != "automated" ]; then
            echo "Execution mode is '$MODE'. PR label reconciliation applies only to automated PR releases. Skipping."
            exit 0
          fi

          PR_NUMBER="${{ github.event.pull_request.number }}"
          echo "Verifying release artifacts before reconciling PR #$PR_NUMBER labels..."

          if ! git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag v$VERSION does not exist. Cannot finalize PR label state."
            exit 1
          fi

          if [ "$PUBLISHED_IN_RUN" = "true" ]; then
            echo "Package prisma-flow@$VERSION was published in this workflow run. Verifying npm registry visibility with propagation retry..."
          else
            echo "Package prisma-flow@$VERSION was already published prior to this workflow run. Verifying npm registry visibility..."
          fi

          MAX_ATTEMPTS=6
          SLEEP_SECONDS=5
          NPM_VERIFIED=false

          for attempt in 1 2 3 4 5 6; do
            if npm view "prisma-flow@$VERSION" version >/dev/null 2>&1; then
              echo "npm registry confirms prisma-flow@$VERSION (attempt $attempt/$MAX_ATTEMPTS)."
              NPM_VERIFIED=true
              break
            fi

            if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
              echo "npm registry has not propagated prisma-flow@$VERSION yet (attempt $attempt/$MAX_ATTEMPTS). Retrying in ${SLEEP_SECONDS}s..."
              sleep "$SLEEP_SECONDS"
            fi
          done

          if [ "$NPM_VERIFIED" != "true" ]; then
            echo "::error::npm registry did not expose prisma-flow@$VERSION within the verification window. Cannot finalize PR label state."
            exit 1
          fi

          if ! gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "::error::GitHub Release v$VERSION does not exist. Cannot finalize PR label state."
            exit 1
          fi

          echo "All release artifacts for v$VERSION verified. Reconciling labels on PR #$PR_NUMBER..."

          # Ensure autorelease: tagged label exists in repository without overwriting or suppressing errors
          if ! gh label view "autorelease: tagged" >/dev/null 2>&1; then
            echo "Creating missing 'autorelease: tagged' label..."
            gh label create "autorelease: tagged" --color "0e8a16" --description "Release has been tagged"
          else
            echo "Label 'autorelease: tagged' exists in repository."
          fi

          CURRENT_LABELS="$(gh pr view "$PR_NUMBER" --json labels --jq '[.labels[].name]')"
          HAS_PENDING="$(echo "$CURRENT_LABELS" | jq 'contains(["autorelease: pending"])')"
          HAS_TAGGED="$(echo "$CURRENT_LABELS" | jq 'contains(["autorelease: tagged"])')"

          echo "PR #$PR_NUMBER current labels: $CURRENT_LABELS"
          echo "HAS_PENDING=$HAS_PENDING, HAS_TAGGED=$HAS_TAGGED"

          EDIT_ARGS=()
          if [ "$HAS_PENDING" = "true" ]; then
            EDIT_ARGS+=(--remove-label "autorelease: pending")
          fi
          if [ "$HAS_TAGGED" != "true" ]; then
            EDIT_ARGS+=(--add-label "autorelease: tagged")
          fi

          if [ ${#EDIT_ARGS[@]} -gt 0 ]; then
            echo "Executing: gh pr edit $PR_NUMBER ${EDIT_ARGS[*]}"
            gh pr edit "$PR_NUMBER" "${EDIT_ARGS[@]}"
            echo "Successfully updated PR #$PR_NUMBER labels."
          else
            echo "PR #$PR_NUMBER labels are already reconciled (autorelease: tagged present, autorelease: pending absent)."
          fi

      - name: Final Release Summary
        shell: bash
        run: |
          VERSION="${{ steps.release-context.outputs.release_version }}"
          MODE="${{ steps.release-context.outputs.mode }}"
          echo "================================================="
          echo "Release v$VERSION Status Report:"
          echo " - Mode:           $MODE"
          echo " - Git Tag:        v$VERSION (Verified)"
          echo " - npm Package:    prisma-flow@$VERSION (Verified)"
          echo " - GitHub Release: v$VERSION (Verified)"
          if [ "$MODE" = "automated" ]; then
            echo " - PR Labels:      autorelease: tagged (Reconciled)"
          fi
          echo "================================================="
