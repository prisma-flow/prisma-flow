name: Publish npm packages

on:
  pull_request:
    branches: [main]
    types: [closed]

concurrency:
  group: npm-publish-main
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write # Required for npm provenance / trusted publishing

jobs:
  publish:
    name: Verify and publish new package versions
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.user.login == 'github-actions[bot]' &&
      contains(github.event.pull_request.labels.*.name, 'autorelease: pending')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22.x"
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Ensure npm 11 for trusted publishing
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Verify release versions
        id: version
        shell: bash
        run: |
          CLI_VERSION="$(node -p "require('./packages/cli/package.json').version")"
          SHARED_VERSION="$(node -p "require('./packages/shared/package.json').version")"

          if [ "$CLI_VERSION" != "$SHARED_VERSION" ]; then
            echo "The CLI ($CLI_VERSION) and shared package ($SHARED_VERSION) versions must match."
            exit 1
          fi

          echo "version=$CLI_VERSION" >> "$GITHUB_OUTPUT"

      - name: Check npm publication status
        id: npm
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          if npm view "@prisma-flow/shared@$VERSION" version >/dev/null 2>&1; then
            echo "publish_shared=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish_shared=true" >> "$GITHUB_OUTPUT"
          fi

          if npm view "prisma-flow@$VERSION" version >/dev/null 2>&1; then
            echo "publish_cli=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish_cli=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify production readiness
        run: npm run verify:release
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Publish @prisma-flow/shared to npm (Trusted Publishing)
        if: steps.npm.outputs.publish_shared == 'true'
        run: npm publish --workspace=@prisma-flow/shared --provenance --access public

      - name: Publish prisma-flow to npm (Trusted Publishing)
        if: steps.npm.outputs.publish_cli == 'true'
        run: npm publish --workspace=prisma-flow --provenance --access public

      - name: Generate release notes
        if: steps.npm.outputs.publish_shared == 'true' || steps.npm.outputs.publish_cli == 'true'
        run: |
          PREVIOUS_TAG="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)"
          if [ -n "$PREVIOUS_TAG" ]; then
            git log "$PREVIOUS_TAG"..HEAD --pretty=format:"- %s (%h)" > release-notes.txt
          else
            git log --pretty=format:"- %s (%h)" > release-notes.txt
          fi

      - name: Create GitHub release
        if: steps.npm.outputs.publish_shared == 'true' || steps.npm.outputs.publish_cli == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: release-notes.txt
          files: packages/cli/dist/**
